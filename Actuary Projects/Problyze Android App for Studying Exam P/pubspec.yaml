name: problyze
description: "A probability calculator for actuarial students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.70.2
  cupertino_icons: ^1.0.8
  flutter_math_fork: ^0.7.3
  flutter_tex: ^4.0.13
  flutter_bloc: ^8.1.3

  # 🔽 New packages for file + REST API support
  file_picker:
    git:
      url: https://github.com/miguelpruivo/flutter_file_picker.git
      ref: master
  csv: ^5.0.2
  http: ^0.13.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.5
  test: ^1.24.3

flutter:
  uses-material-design: true
